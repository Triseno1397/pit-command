<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover so the sticky header and add-bar can clear the notch/home bar.
     Zoom is deliberately NOT locked: inputs are 16px so iOS won't auto-zoom, and a
     crew chief in direct sun should still be able to pinch in. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111419">
<meta name="description" content="Race day tire data console for a Limited Late Model crew chief. Works offline.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pit Command">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<title>PIT COMMAND — Limited Late Model Race Day Console</title>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <button class="logo" onclick="go({page:'hub'})" aria-label="Pit Command home"><span class="flag"></span>
      <span>Pit Command<small>Limited Late Model · Asphalt · Left Turns Only</small></span>
    </button>
    <div class="hdr-meta" id="hdrMeta"></div>
  </div>
</header>

<div class="wrap" id="app"></div>
<div id="modal" style="display:none"></div>
<div class="add-bar" id="addBar" style="display:none">
  <button class="main" onclick="addSession('Practice')">+ Practice</button>
  <button onclick="addSession('Qualifying')">+ Qualifying</button>
  <button onclick="addSession('Main')">+ Main</button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
